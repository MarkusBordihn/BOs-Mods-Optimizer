plugins {
  id 'maven-publish'
  id 'net.minecraftforge.gradle' version '7.0.0-beta.46'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
  id 'com.gradleup.shadow' version '9.0.0-beta4'
}

apply plugin: 'net.minecraftforge.gradle'

base {
  archivesName = "${mod_id}-forge-${minecraft_version}"
}

minecraft {
  mappings channel: 'official', version: "${project.minecraft_version}"

  runs {
    configureEach {
      systemProperty 'forge.logging.console.level', 'debug'
      systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
    }

    client {
      workingDir = project.file('run/client')
    }

    server {
      workingDir = project.file('run/server')
    }

    gameTestServer {
      workingDir = project.file('run/gametest')
      systemProperty 'forge.enableGameTest', 'true'
      systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
      workingDir = project.file('run/data')
      args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
    }
  }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
  mavenCentral()
  maven minecraft.mavenizer
  maven fg.forgeMaven
  maven fg.minecraftLibsMaven
  maven {
    name = 'Forge'
    url = 'https://maven.minecraftforge.net'
  }
  maven {
    name = 'Minecraft libraries'
    url = 'https://libraries.minecraft.net'
  }
  exclusiveContent {
    forRepository {
      maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
      }
    }
    filter {
      includeGroupAndSubgroups('org.spongepowered')
    }
  }
  maven {
    url "https://www.cursemaven.com"
    content {
      includeGroup "curse.maven"
    }
  }
  mavenLocal()
}

configurations {
  shade
  implementation.extendsFrom shade
}

dependencies {
  implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

  annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'

  // Include Common code
  compileOnly project(":Common")

  // Extra libraries
  shade 'com.moandjiezana.toml:toml4j:0.7.2'
  shade 'com.github.zafarkhaja:java-semver:0.9.0'

  // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
  implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Test).configureEach {
  failOnNoDiscoveredTests = false
}

processResources {
  from project(":Common").sourceSets.main.resources
}

jar {
  archiveClassifier = 'slim'
  manifest {
    attributes([
        "FMLModType"              : "LIBRARY",
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "1",
        "Implementation-Title"    : project.name,
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_id}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
  }
}

shadowJar {
  archiveClassifier = ''
  configurations = [project.configurations.shade]
  relocate 'com.moandjiezana.toml', "${project.group}.thirdparty.toml4j"
  relocate 'com.github.zafarkhaja', "${project.group}.thirdparty.semver"
  dependencies {
    include(dependency('com.moandjiezana.toml:toml4j:.*'))
    include(dependency('com.github.zafarkhaja:java-semver:.*'))
  }
  minimize()
}

assemble.dependsOn shadowJar

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifact jar
    }
  }
}

sourceSets.main {
  def dir = layout.buildDirectory.dir("sourcesSets/main")
  output.resourcesDir = dir
  java.destinationDirectory = dir
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, shadowJar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.releaseType = project.curseforge_release_type
    mainFile.addModLoader('Forge')
    mainFile.addGameVersion(project.minecraft_version)
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("CHANGELOG.md").text
    uploadFile = shadowJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
  }
}
