plugins {
  id 'net.neoforged.moddev' version '2.0.126'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
  id 'com.gradleup.shadow' version '9.0.0-beta4'
}

base {
  archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

neoForge {
  version = project.neoforge_version

  runs {
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }

    client {
      client()
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
      server()
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      programArgument '--nogui'
    }

    gameTestServer {
      type = 'gameTestServer'
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
      clientData()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
  }

  mods {
    "${project.mod_id}" {
      sourceSet sourceSets.main
    }
  }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.register("idePostSync") {
  group = 'ide'
}

repositories {
  maven {
    url "https://www.cursemaven.com"
    content {
      includeGroup "curse.maven"
    }
  }
  mavenLocal()
}

configurations {
  shade
  implementation.extendsFrom shade
}

dependencies {
  compileOnly project(":Common")

  // Test dependencies
  testImplementation project(":Common")

  // Extra libraries
  shade 'com.moandjiezana.toml:toml4j:0.7.2'
  shade 'com.github.zafarkhaja:java-semver:0.9.0'
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") && !it.name.contains("Test") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
  from(project(":Common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
  from project(":Common").sourceSets.main.resources
}

jar {
  archiveClassifier = 'slim'
  manifest {
    attributes([
        "FMLModType"              : "LIBRARY",
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "1",
        "Implementation-Title"    : project.name,
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_id}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
  }
  finalizedBy shadowJar
}

shadowJar {
  archiveClassifier = ''
  configurations = [project.configurations.shade]
  relocate 'com.moandjiezana.toml', "${project.group}.thirdparty.toml4j"
  relocate 'com.github.zafarkhaja', "${project.group}.thirdparty.semver"
  dependencies {
    include(dependency('com.moandjiezana.toml:toml4j:.*'))
    include(dependency('com.github.zafarkhaja:java-semver:.*'))
  }
  minimize()
}

assemble.dependsOn shadowJar

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, shadowJar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("CHANGELOG.md").text
    uploadFile = shadowJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["neoforge"]
  }
}

test {
  useJUnitPlatform()
}
